name: my checks
on:
  - push
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        python-version: '3.10'

    - name: Sync dependencies and install package
      run: uv sync --dev

    - name: Ruff
      run: uv run ruff check calocem tests

    - name: Mypy
      run: uv run mypy

  examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        python-version: '3.12'

    - name: Sync dependencies and install package
      run: uv sync --dev

    - name: Run example scripts
      working-directory: examples
      env:
        MPLBACKEND: Agg
      run: |
        for f in *.py; do
          # example_debug.py loads gen3_calofile_no_mass.csv, which the CSV loader cannot read yet
          if [ "$f" = "example_debug.py" ]; then continue; fi
          echo "::group::$f"
          uv run python "$f"
          echo "::endgroup::"
        done

  build:
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
  
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        
    - name: Sync dependencies and install package
      run: uv sync --dev

    - name: Run tests
      run: uv run pytest
