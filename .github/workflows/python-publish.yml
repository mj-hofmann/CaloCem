# Builds the package and uploads it to PyPI when a GitHub release is published.
#
# To release: bump `version` in pyproject.toml (and the CHANGELOG heading),
# merge to main, then create a GitHub release whose tag is `v<version>`,
# e.g. `v0.4.0`. The job fails early if the tag and the version disagree.

name: Publish Python Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.repository == 'mj-hofmann/calocem'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Check tag matches package version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "$TAG" != "v$version" ]; then
          echo "::error::Release tag '$TAG' does not match pyproject.toml version '$version' (expected 'v$version')."
          exit 1
        fi

    - name: Sync dependencies
      run: uv sync --dev

    - name: Build package
      run: uv build


    - name: Publish package to PyPI
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: uv publish

    - name: Clean up
      run: rm -rf dist build *.egg-info
