site_name: ""

theme:
  name: "material"
  palette:
    scheme: slate
    primary: deep purple
  font:
    text: Poppins
    code: Bitter
  logo: assets/icon.png
  favicon: assets/favicon.png
  features:
    - search.highlight
    - search.suggest
    - search.share
    - header.autohide
    - navigation.sections
    - navigation.footer
    - navigation.top
    
repo_url: https://github.com/mj-hofmann/CaloCem
repo_name: mj-hofmann/CaloCem

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_signature_annotations: true
            separate_signature: true
  - mkdocs-jupyter:
      no_input: False
      execute: True
  - search
  - table-reader
  - offline
  - git-revision-date-localized:
      enable_creation_date: true
  - git-committers:
      repository: mj-hofmann/CaloCem
      branch: main

nav:
  - Home: index.md
  - User Guide:
      - Loading Data: loading.md
      - Processing Parameters: processing-parameters.md
      - Plotting: plotting_example.ipynb
      - Characteristic Values: quantification.md
      - Main Peak Parameters: example_get_mainpeak_params.ipynb
      - Tian Correction: tian.md
  - Reference:
      - Measurement: reference/measurement.md
      - ProcessingParameters: reference/processing-parameters.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mj-hofmann
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/matthias-j-hofmann/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css


copyright: Copyright &copy; 2023 - present Matthias Hofmann
